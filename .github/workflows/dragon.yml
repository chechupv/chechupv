# Draws a red-and-gold "dragon" that eats the contribution grid, every night.
# The images are pushed to the `output` branch and embedded in README.md.

name: Dragon

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/dragon.yml]

permissions:
  contents: write

concurrency: dragon

jobs:
  dragon:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Draw the dragon from the contribution grid
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # color_dots: no contributions, then low -> high (exactly 5 colors)
          outputs: |
            dist/dragon.svg?color_snake=#c8102e&color_dots=#f3e9dc,#f5d77a,#e8b730,#c9921b,#9c6b0a
            dist/dragon-dark.svg?color_snake=#de2910&color_dots=#2a1a1a,#7a4a12,#b8860b,#e0a526,#ffd700

      - name: Push the images to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
