# Redraws an animated Chinese dragon every night from your GitHub activity:
# it grows with the year's contributions and swims faster after a busy week.
# The image is pushed to the `output` branch and embedded in README.md.

name: Dragon

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/dragon.yml
      - scripts/dragon.py

permissions:
  contents: write

concurrency: dragon

jobs:
  dragon:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Draw the dragon
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/dragon.py --login "${{ github.repository_owner }}" --out dist/dragon.svg

      - name: Push the image to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
